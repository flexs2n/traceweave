[[cases]]
task = "how do memory status transitions preserve history"
budget = 4000
expect_symbols = ["memory transitions"]
expect_files = ["crates/ccc-memory/src/lib.rs"]
forbidden_paths = ["target"]
kind = "tuning"

[[cases]]
task = "how does contradiction detection share scope"
budget = 4000
expect_symbols = ["conflict detection scope"]
expect_files = ["crates/ccc-memory/src/lib.rs"]
forbidden_paths = ["target"]
kind = "held_out"
